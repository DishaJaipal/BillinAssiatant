<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">

  <title>ProShop Dashboard</title>

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B8A6A">
  <link rel="manifest" href="./manifest.webmanifest">

  
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./dashboard.css">

  <script src="./Javascript/common.js" defer></script>

  
</head>

<body>
  <div class="app-shell">
    <header>
      <div class="top-bar">

        <div class="top-bar-left">
          <img class="store-icon" src="./assets/icons/store.png" alt="ProShop logo">
          <span class="logo">ProShop</span>
        </div>
        <div class="top-bar-right">
          <!-- <button class="header-button" type="button">
            <img src="icons/notification.png" alt="Notifications">
          </button> -->
          <button class="header-button" type="button">
            <img src="./assets/icons/user.png" alt="Profile">
          </button>
        </div>

      </div>
    </header>

    <div class="main-container">
      
      <div class="dashboard-content">

        <div class="card-welcome">
          <div class="card-content">
            <p class="card-date" id="cardDate"></p>

            <h1 class="welcome-title">
              Welcome Back,<br>
              ProShop
            </h1>

            <!-- <div class="card-status-row">
              <span class="status-dot"></span>
              <span>Shop status: Online</span>
            </div> -->
          </div>
        </div>

        <div class="stats-row">

          <div class="stat-card">
            <p class="stat-label">Today's Sales</p>
            <p class="stat-value" id="stat-sales"></p>
          </div>

          <div class="stat-card">
            <p class="stat-label">Low Stock</p>

            <div class="stat-value-container">
              <p class="stat-value low-stock-number" id="stat-low-stock-count"></p>
              <p class="stat-items-label">items</p>
            </div>
          </div>

        </div>

        <div class="section-heading">
          <h2>Quick Actions</h2>
        </div>

        <div class="card-action">
          <a href="./pages/Inventory/Inventory.html" class="card-link">

            <div class="action-left">
              <div class="card-icon inventory-icon-background">
                <img src="./assets/icons/box.png" alt="Inventory">
              </div>

              <div class="card-text">
                <h2 class="card-title">Inventory</h2>
                <span class="card-subtitle">Manage your stock</span>
              </div>
            </div>

            <div class="card-arrow">
              <img src="./assets/icons/chevron.png" alt="">
            </div>

          </a>
        </div>

        <div class="card-action">
          <a href="./pages/voiceBilling/voiceBilling.html" class="card-link">

            <div class="action-left">
              <div class="card-icon billing-icon-background">
                <img src="./assets/icons/mic.png" alt="Billing">
              </div>

              <div class="card-text">
                <h2 class="card-title">Billing</h2>
                <span class="card-subtitle">Create a bill by speaking</span>
              </div>
            </div>

            <div class="card-arrow">
              <img src="./assets/icons/chevron.png" alt="">
            </div>

          </a>
        </div>
        <div class="footer-gap">

        </div>
        <div class="footer-section">
          <footer>
            <Span>Copyright @2026</Span>
          </footer>
        </div>
      </div>
        

      <aside class="sidebar-desktop" id="sidebar">
        <div class="nav-item">
          <button id="menuToggle" >
  
            <div class="nav-icon">
              <img src="./assets/icons/menu.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Menu</span>
            </div>
          </button>
        </div>
        <div class="nav-item">
          <button class="dashboard-active" type="button"
            onclick="window.location.href=''">
  
            <div class="nav-icon">
              <img src="./assets/icons/dashboard.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Dashboard</span>
            </div>
          </button>
        </div>
        <div class="nav-item">
          <button class="inventory" type="button"
            onclick="window.location.href='./pages/Inventory/Inventory.html'">
  
            <div class="nav-icon">
              <img src="./assets/icons/box.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Inventory</span>
            </div>
          </button>
        </div>
        <div class="nav-item">
          <button class="billing" type="button"
            onclick="window.location.href='./pages/voiceBilling/voiceBilling.html'">
  
            <div class="nav-icon">
              <img src="./assets/icons/bill.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Billing</span>
            </div>
  
          </button>
        </div>
        <div class="nav-item">
          <button class="profile" id="profile1" type="button">
  
            <div class="nav-icon">
              <img src="./assets/icons/user.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Profile</span>
            </div>
  
          </button>
        </div> 
      </aside>
      
    </div>
    <nav class="bottom-nav">
        <div class="nav-item">
          <button class="dashboard active" type="button"
            onclick="window.location.href=''">
  
            <div class="nav-icon">
              <img src="./assets/icons/dashboard.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Dashboard</span>
            </div>
          </button>
        </div>
        <div class="nav-item">
          <button class="inventory" type="button"
            onclick="window.location.href='./pages/Inventory/Inventory.html'">
  
            <div class="nav-icon">
              <img src="./assets/icons/box.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Inventory</span>
            </div>
          </button>
        </div>
        <div class="nav-item">
          <button class="billing" type="button"
            onclick="window.location.href='./pages/voiceBilling/voiceBilling.html'">
  
            <div class="nav-icon">
              <img src="./assets/icons/bill.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Billing</span>
            </div>
  
          </button>
        </div>
        <div class="nav-item">
          <button class="profile" id="profile2" type="button">
  
            <div class="nav-icon">
              <img src="./assets/icons/user.png" alt="">
            </div>
  
            <div class="nav-label">
              <span>Profile</span>
            </div>
  
          </button>
        </div>
      </nav>

    <!-- <footer>
      <Span>Copyright @2026</Span>
    </footer> -->
  </div>

  <dialog class="overlay" id="profileForm">
    <div class="pop-up">
      <h2>User Profile</h2>
      <form id="addUserForm">
        <!-- <label for="userFirstName">First Name</label> -->
        <input type="text" id="userFirstName" placeholder="FirstName" required />
        <!-- <label for="userLastName">Last name</label> -->
        <input type="text" id="userLastName" placeholder="LastName" required />
        <!-- <label for="userNumber">Quantity</label> -->
        <input type="text" id="userNumber" inputmode="numeric" maxlength="10" placeholder="Phone Number" required />

        <input type="text" id="userEmail" inputmode="email" placeholder="E-mail" required />
        <!-- <label for="itemType">Type</label> -->
        <input type="text" id="gstID" placeholder="GstID" required />
        
        <div class="popup-actions">
          <button
            type="button"
            id="cancelUserPopupButton"
            class="secondary-button"
          >
            Cancel
          </button>
          <button id="editButton" type="submit" class="primary-button">
            Edit Details
          </button>
        </div>
      </form>
    </div>
  </dialog>

</body>
