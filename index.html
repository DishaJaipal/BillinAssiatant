            <p class="stat-value" id="stat-sales"></p>
          </div>

          <div class="stat-card">
            <p class="stat-label">Low Stock</p>

            <div class="stat-value-container">

              <p class="stat-items-label">items</p>

            </div>

              </div>

              <div class="card-text">
                <h2 class="card-title">Billing</h2>
                <span class="card-subtitle">Create a bill by speaking</span>
              </div>
            </div>

            <div class="card-arrow">
              <img src=".../assets/icons/chevron.png" alt="">
            </div>

          </a>
        </div>
        <div class="footer-section">
          <footer>

          </footer>
        </div>
      </div>
