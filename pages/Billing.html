<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Bill Generated Successfully</title>

    <link
      rel="stylesheet"
      href="/CSS/BillSuccess.css.css"
       rel="stylesheet" href="../CSS/billing.css">
    />
    <script src="../Javascript/BillSuccess.js" defer></script>
  </head>

  <body>

    <main class="mobile-screen">

      <!--  HEADER -->

      <header class="header">

        <!-- Back Button -->
        <button
          id ="backButton"
          class="icon-btn back-btn"
          aria-label="Go Back"
          type="button"
        >
          <img
          
            src="/assest/ICONS/left.png"
            alt="Back"
          />
        </button>
        


        <!-- Header Title -->
        <h1>Success</h1>


       
      </header>


      <!-- ================= SUCCESS SECTION ================= -->

      <section class="success">

        <!-- Success Outer Circle -->
        <div class="success-outer-circle">

          <!-- Green Check Circle -->
          <div class="success-icon">

            <img
              src="/assest/ICONS/check (1).png"
              alt="Success"
            />

          </div>

        </div>


        <!-- Success Message -->
        <h2>
          Bill Generated Successfully
        </h2>


        <p class="description">
          The transaction has been processed and recorded
          in your inventory system.
        </p>

      </section>


      <!-- ================= BILL DETAILS ================= -->

      <section class="bill-details">

        <!-- Bill Number -->
        <article class="card">

          <strong>
            BILL NUMBER
          </strong>

          <h2>
            
            #INV-88291
          </h2>

        </article>


        <!-- Date -->
        <article id="billDate"class="card">

          <strong>
            DATE
          </strong>

          <h2>
            
            Oct 24, 2023
          </h2>

        </article>

      </section>


      <!-- ================= AMOUNT CARD ================= -->

      <section class="amount-card">

        <div class="amount-content">

          <strong>
            Total Amount Paid
          </strong>

          <h1>
            Rs 1,240.50
          </h1>

        </div>


        <!-- Receipt Button -->
        <button
          class="receipt-btn"
          aria-label="View Receipt"
        >

          <img
            src="/assest/ICONS/Billing Icon.png"
            alt="Receipt"
          />

        </button>

      </section>


      <!-- ================= ACTION LIST ================= -->

      <section class="action-list">


        <!-- Share Receipt Button -->
        <button id="shareReceiptButton"class="action-item">
          <div class="action-left">

            <span class="action-icon">

              <img
                src="/assest/ICONS/share.png"
                alt="Share"
              />

            </span>

            <p>
              Share Receipt
            </p>

          </div>


          <!-- Right Arrow -->
          <span class="arrow">

            <img
              src="/assest/ICONS/next.png"
              alt="Next"
            />

          </span>

        </button>


        <!-- Print Bill Button -->
        <button id="printBillButton"class="action-item">

          <div class="action-left">

            <span class="action-icon">

              <img
                src="/assest/ICONS/printer.png"
                alt="Print"
              />

            </span>

            <p>
              Print Bill
            </p>

          </div>


          <!-- Right Arrow -->
          <span class="arrow">

            <img
              src="/assest/ICONS/next.png"
              alt="Next"
            />

          </span>

        </button>

      </section>


      <!-- ================= NEW BILL BUTTON ================= -->

      <div class="new-bill-container">

        <button class="new-bill">

          <img
            src="/assest/ICONS/add (2).png"
            alt="Add"
          />

          <p>
            New Bill
          </p>

        </button>

      </div>

    </main>

  </body>
</html>
