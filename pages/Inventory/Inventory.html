<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Inventory</title>

  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="./Inventory.css">

  <script src="../../Javascript/common.js" defer></script>
  <script src="../../Javascript/Inventory.js" defer></script>
</head>

<body>

  <main class="app_container">

    <!-- ================= INVENTORY HEADER ================= -->
    <section class="inventory_section">

      <div class="left_inventory_section">

        <button id="backButton" class="header-icon-button" type="button">
          <img src="../../assets/icons/left.png" alt="Back">
        </button>

        <h4>Inventory</h4>

      </div>

      <div class="right_inventory_section">

        <button
          id="addProductButton"
          class="header-icon-button"
          type="button"
        >
          <img
            src="../../assets/icons/add (2).png"
            alt="Add Product"
          >
        </button>

        

      </div>

    </section>

    <!-- ================= MAIN CONTENT ================= -->

    <section class="main-container">

      <div class="main-content">

        <!-- ================= SEARCH ================= -->

        <div class="search-container">

          <div class="search-input-wrapper">

            <img
              class="search-icon"
              src="../../assets/icons/search.png"
              alt="Search"
            >

            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="Search Product"
            >

          </div>

        </div>

        <!-- ================= CARDS ================= -->

        <div class="card_section">

          <div class="card_box">

            <div class="card_box_header">
              Items IN
            </div>

            <div
              class="card_box_count"
              id="itemsInCount"
            >
              03
            </div>

          </div>


          <div class="card_box">

            <div class="card_box_header">
              Low Stock
            </div>

            <div
              class="card_box_count"
              id="lowStockCount"
            >
              00
            </div>

          </div>


          <div class="card_box">

            <div class="card_box_header">
              Out of Stock
            </div>

            <div
              class="card_box_count"
              id="outOfStockCount"
            >
              01
            </div>

          </div>

        </div>

        <!-- ================= TABLE ================= -->

        <div class="table-container">

          <table>

            <thead>

              <tr>
                <th>Item</th>
                <th>Cost</th>
                <th>Weight</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Action</th>
              </tr>

            </thead>

            <tbody id="tableBody">

              <tr id="emptyBillRow">

                <td
                  colspan="6"
                  class="empty-bill-cell"
                >
                  No bill items yet. Use Add Item or voice billing.
                </td>

              </tr>

            </tbody>

          </table>

        </div>

        <!-- ================= PAGINATION ================= -->

        <div class="pagination-container">

          <div class="pagination-text">
            Showing 3 of 3 products
          </div>

          <div class="pagination-buttons">

            <button
              class="pagination-btn"
              type="button"
            >
              <img
                src="../../assets/icons/left.png"
                alt="Previous"
              >
            </button>

            <button
              class="pagination-btn"
              type="button"
            >
              <img
                src="../../assets/icons/chevron.png"
                alt="Next"
              >
            </button>

          </div>

        </div>

      </div>


      <!-- ================= DESKTOP SIDEBAR ================= -->

      <aside
        class="sidebar-desktop"
        id="sidebar"
      >

        <div class="nav-item">

          <button
            id="menuToggle"
            type="button"
          >

            <div class="nav-icon">
              <img
                src="../../assets/icons/menu.png"
                alt="Menu"
              >
            </div>

            <div class="nav-label">
              <span>Menu</span>
            </div>

          </button>

        </div>


        <div class="nav-item">

          <button
            class="dashboard-active"
            type="button"
            onclick="window.location.href='../../index.html'"
          >

            <div class="nav-icon">
              <img
                src="../../assets/icons/dashboard.png"
                alt="Dashboard"
              >
            </div>

            <div class="nav-label">
              <span>Dashboard</span>
            </div>

          </button>

        </div>


        <div class="nav-item">

          <button
            class="inventory"
            type="button"
          >

            <div class="nav-icon">
              <img
                src="../../assets/icons/box.png"
                alt="Inventory"
              >
            </div>

            <div class="nav-label">
              <span>Inventory</span>
            </div>

          </button>

        </div>


        <div class="nav-item">

          <button
            class="billing"
            type="button"
            onclick="window.location.href='../voiceBilling/voiceBilling.html'"
          >

            <div class="nav-icon">
              <img
                src="../../assets/icons/bill.png"
                alt="Billing"
              >
            </div>

            <div class="nav-label">
              <span>Billing</span>
            </div>

          </button>

        </div>


        <div class="nav-item">

          <button
            class="profile"
            type="button"
            id="profile1"
          >

            <div class="nav-icon">
              <img
                src="../../assets/icons/user.png"
                alt="Profile"
              >
            </div>

            <div class="nav-label">
              <span>Profile</span>
            </div>

          </button>

        </div>

      </aside>

    </section>


    <!-- ================= MOBILE BOTTOM NAV ================= -->

    <nav class="bottom-nav">

      <div class="nav-item">

        <button
          class="dashboard"
          type="button"
          onclick="window.location.href='../../index.html'"
        >

          <div class="nav-icon">
            <img
              src="../../assets/icons/dashboard.png"
              alt="Dashboard"
            >
          </div>

          <div class="nav-label">
            <span>Dashboard</span>
          </div>

        </button>

      </div>


      <div class="nav-item">

        <button
          class="inventory active"
          type="button"
        >

          <div class="nav-icon">
            <img
              src="../../assets/icons/box.png"
              alt="Inventory"
            >
          </div>

          <div class="nav-label">
            <span>Inventory</span>
          </div>

        </button>

      </div>


      <div class="nav-item">

        <button
          class="billing"
          type="button"
          onclick="window.location.href='../voiceBilling/voiceBilling.html'"
        >

          <div class="nav-icon">
            <img
              src="../../assets/icons/bill.png"
              alt="Billing"
            >
          </div>

          <div class="nav-label">
            <span>Billing</span>
          </div>

        </button>

      </div>


      <div class="nav-item">

        <button
          class="profile"
          type="button"
          id="profile2"
        >

          <div class="nav-icon">
            <img
              src="../../assets/icons/user.png"
              alt="Profile"
            >
          </div>

          <div class="nav-label">
            <span>Profile</span>
          </div>

        </button>

      </div>

    </nav>
    <!-- ================= POPUP ================= -->
        <div id="addProductPopup" class="popup">

          <div class="popup-content">

            <h2>Add Product</h2>

            <input
              type="text"
              id="Item"
              placeholder="Item"
            >

            <input
              type="text"
              id="itemType"
              placeholder="Type"
              required
            >

            <input
              type="text"
              id="itemBrand"
              placeholder="Brand"
              required
            >

            <input
              type="number"
              id="cost"
              placeholder="Cost"
            >

            <input
              
              type="text"
              id="Weight"
              placeholder="Weight"
            >

            <input
              type="number"
              id="Quantity"
              placeholder="Quantity"
            >

            <select id="status">
              <option value="Available">Available</option>
              <option value="Out of Stock">Out of Stock</option>
            </select>

            <div class="popup-buttons">

              <button
                id="closePopupButton"
                type="button"
              >
                Close
              </button>

              <button
                id="submitButton"
                type="button"
              >
                Submit
              </button>

            </div>

          </div>

        </div>
        <!-- ================= POPUP END ================= -->

  </main>
  <dialog class="overlay" id="profileForm">
      <div class="pop-up">
        <h2>User Profile</h2>
        <form id="addUserForm">
          <!-- <label for="userFirstName">First Name</label> -->
          <input type="text" id="userFirstName" placeholder="FirstName" required />
          <!-- <label for="userLastName">Last name</label> -->
          <input type="text" id="userLastName" placeholder="LastName" required />
          <!-- <label for="userNumber">Quantity</label> -->
          <input type="text" id="userNumber" inputmode="numeric" pattern="[0-9]{10}" placeholder="Phone Number" required />
  
          <input type="text" id="userEmail" inputmode="email" placeholder="E-mail" required />
          <!-- <label for="itemType">Type</label> -->
          <input type="text" id="gstID" placeholder="GstID" required />
          
          <div class="popup-actions">
            <button
              type="button"
              id="cancelUserPopupButton"
              class="secondary-button"
            >
              Cancel
            </button>
            <button id="editButton" type="submit" class="primary-button">
              Edit Details
            </button>
          </div>
        </form>
      </div>
    </dialog>

</body>
</html>
